name: Feature request / 功能建议
description: Suggest an idea or improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述使用场景，而不是只写“想要某个功能”。
      placeholder: 我经常在晚上写代码，希望宠物能在固定时间提醒我休息……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么实现？
      description: 可以描述交互、配置项或大致技术方案。

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你试过或考虑过的其他做法。

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 这个功能不需要引入未授权的第三方素材
          required: true
