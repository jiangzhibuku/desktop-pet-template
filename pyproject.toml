[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-pet"
version = "0.3.1"
description = "A transparent Windows desktop pet with frame animations and an LLM agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Desktop Pet contributors" }]
keywords = ["desktop-pet", "kivy", "windows", "llm", "agent", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
]
dependencies = [
  "kivy==2.3.1",
  "requests>=2.31,<3",
  "Pillow>=10,<12",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
cutout = ["rembg>=2.0", "onnxruntime>=1.17"]

[project.scripts]
desktop-pet = "desktop_pet.__main__:main"
desktop-pet-create = "desktop_pet.creator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long Chinese strings and tables read better on one line.
# UP032: .format() is used intentionally in a few log/bubble strings.
ignore = ["E501", "UP032"]
